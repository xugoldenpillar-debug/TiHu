<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="o1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#182234"/>
    </linearGradient>
    <linearGradient id="o1-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="500" height="360" rx="16" fill="url(#o1-bg)"/>

  <!-- Blueprint Math Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="0.8">
    <circle cx="150" cy="250" r="80" fill="none" stroke-dasharray="2 4"/>
    <circle cx="350" cy="250" r="80" fill="none" stroke-dasharray="2 4"/>
    <path d="M50 50 L450 310 M50 310 L450 50" stroke-dasharray="3 6"/>
  </g>

  <!-- High-Tech Disc Wheels -->
  <circle cx="150" cy="250" r="56" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="150" cy="250" r="36" fill="none" stroke="url(#o1-disc)" stroke-width="8" opacity="0.6"/>
  <circle cx="150" cy="250" r="10" fill="#38bdf8"/>

  <circle cx="350" cy="250" r="56" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="350" cy="250" r="36" fill="none" stroke="url(#o1-disc)" stroke-width="8" opacity="0.6"/>
  <circle cx="350" cy="250" r="10" fill="#38bdf8"/>

  <!-- Aero Monocoque Frame -->
  <path d="M150 250 L220 160 L325 150 L350 250 L230 250 Z" fill="rgba(14, 165, 233, 0.15)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>
  <line x1="220" y1="160" x2="230" y2="250" stroke="#38bdf8" stroke-width="5"/>
  <path d="M325 150 L335 125 L355 130" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

  <!-- Monolith Saddle -->
  <path d="M195 158 L235 158 L240 164 L200 164 Z" fill="#f8fafc"/>

  <!-- Geometric Minimalist Pelican (Reasoning Mode) -->
  <polygon points="210,130 270,120 260,180 200,175" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="210,130 185,90 235,95" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  
  <polygon points="255,130 290,80 325,75 315,115" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="310" cy="85" r="4" fill="#0f172a"/>

  <!-- Beak & Thinking Logic Mesh Pouch -->
  <polygon points="325,75 425,85 340,95" fill="#f59e0b"/>
  <path d="M335 95 Q 380 155 425 85 Z" fill="rgba(245, 158, 11, 0.85)" stroke="#d97706" stroke-width="2"/>

  <!-- Thinking Tree Graph inside Pouch -->
  <g stroke="#ffffff" stroke-width="1.5" fill="#38bdf8">
    <circle cx="365" cy="115" r="3"/>
    <circle cx="385" cy="105" r="3"/>
    <circle cx="395" cy="125" r="3"/>
    <line x1="365" y1="115" x2="385" y2="105"/>
    <line x1="365" y1="115" x2="395" y2="125"/>
  </g>

  <!-- Legs -->
  <line x1="220" y1="175" x2="230" y2="240" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="175" x2="230" y2="260" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Benchmark Badge -->
  <rect x="20" y="20" width="135" height="28" rx="14" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="34" cy="34" r="5" fill="#38bdf8"/>
  <text x="46" y="38" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600">OpenAI o1</text>
</svg>