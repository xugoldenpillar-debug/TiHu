<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="empty-pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Cyber Sandbox Chamber Frame -->
  <rect x="30" y="25" width="180" height="130" rx="16" fill="url(#empty-pod)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="35" width="160" height="110" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Subtle Grid inside Sandbox -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="70" x2="200" y2="70"/>
    <line x1="40" y1="105" x2="200" y2="105"/>
    <line x1="90" y1="35" x2="90" y2="145"/>
    <line x1="150" y1="35" x2="150" y2="145"/>
  </g>

  <!-- Idle Pelican Mascot meditating inside sandbox -->
  <path d="M100 110 C95 95, 105 85, 120 85 C135 85, 145 95, 140 110 C130 120, 110 120, 100 110 Z" fill="#f8fafc"/>
  <path d="M110 95 C115 85, 125 85, 130 95 Z" fill="#0d9488"/>
  <circle cx="126" cy="88" r="2" fill="#0b0f19"/>
  <polygon points="130,88 150,92 135,97" fill="#f59e0b"/>

  <!-- Pulsing Sandbox Status Dot -->
  <circle cx="55" cy="50" r="4" fill="#10b981">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="66" y="54" fill="#94a3b8" font-size="10" font-family="monospace">SANDBOX_STANDBY</text>
  <text x="75" y="132" fill="#64748b" font-size="11" font-family="monospace">等待首次模型实验...</text>
</svg>