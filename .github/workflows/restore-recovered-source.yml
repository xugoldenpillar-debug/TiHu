name: Restore recovered TiHu source

on:
  push:
    branches:
      - feat/tihu-platform
    paths:
      - .github/workflows/restore-recovered-source.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import shutil
          import stat
          import zipfile

          expected_parts = [
              Path('.recovery/part-00.b64'),
              Path('.recovery/part-01.b64'),
              Path('.recovery/part-02.b64'),
              Path('.recovery/part-03.b64'),
              Path('.recovery/part-04a.b64'),
              Path('.recovery/part-04b.b64'),
              Path('.recovery/part-05.b64'),
          ]
          missing = [str(p) for p in expected_parts if not p.is_file()]
          if missing:
              raise SystemExit(f'missing recovery parts: {missing}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in expected_parts)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = '33e3127be102f843a4869ef27142fe7e04d8b4658658dc03938a7416460939d2'
          if digest != expected:
              raise SystemExit(f'SHA-256 mismatch: {digest} != {expected}')

          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'corrupt zip member: {bad}')
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe zip path: {info.filename}')
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink not allowed: {info.filename}')
                  # Workflow files are installed separately via the GitHub API so
                  # this GITHUB_TOKEN push never modifies workflow definitions.
                  if path.parts[:2] == ('.github', 'workflows'):
                      continue
                  target = Path(*path.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(info))

          shutil.rmtree('.recovery')
          Path('RECOVERY.md').unlink(missing_ok=True)
          print(f'verified source archive: {digest}')
          PY

      - name: Commit recovered normal source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: restore verified TiHu platform source'
          git push origin HEAD:feat/tihu-platform
