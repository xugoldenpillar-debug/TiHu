<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 · 矢量动画作品</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
    }
    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .canvas-stage {
      position: relative;
      width: 100%;
      height: 460px;
      overflow: hidden;
      background: linear-gradient(180deg, #1e293b 0%, #334155 60%, #1e293b 100%);
    }
    svg.pelican-scene {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Controls Bar */
    .controls {
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.5);
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button.ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    button.ctrl-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #042f2e;
      font-weight: 600;
    }
    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* SVG Animation Keyframes */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes roadMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-80px); }
    }
    @keyframes cloudMove {
      0% { transform: translateX(850px); }
      100% { transform: translateX(-200px); }
    }
    @keyframes bobPelican {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-1deg); }
    }
    @keyframes beakChatter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes pedalCrank {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spokes {
      animation: spin 0.8s linear infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .crank-assembly {
      animation: pedalCrank 0.8s linear infinite;
      transform-origin: 400px 320px;
    }
    .road-dashes {
      animation: roadMove 0.4s linear infinite;
    }
    .cloud-1 {
      animation: cloudMove 16s linear infinite;
    }
    .cloud-2 {
      animation: cloudMove 24s linear infinite -8s;
    }
    .pelican-rider {
      animation: bobPelican 0.8s ease-in-out infinite;
      transform-origin: 360px 240px;
    }
    .pelican-lower-beak {
      animation: beakChatter 2.5s ease-in-out infinite;
      transform-origin: 430px 145px;
    }

    /* Paused State */
    .paused * {
      animation-play-state: paused !important;
    }
    /* Turbo State */
    .turbo .spokes { animation-duration: 0.35s; }
    .turbo .crank-assembly { animation-duration: 0.35s; }
    .turbo .road-dashes { animation-duration: 0.18s; }
    .turbo .pelican-rider { animation-duration: 0.35s; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="title-group">
        <h1>
          <span>🚴‍♂️</span> 鹈鹕骑行探索者
          <span class="badge">自制纯矢量作品</span>
        </h1>
        <p>纯原生 SVG + CSS 关键帧物理骑行动画 · 独立沙箱隔离验证</p>
      </div>
      <div class="stats" id="speedReadout">速度: 24 km/h</div>
    </header>

    <div class="canvas-stage" id="stage">
      <svg class="pelican-scene" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>
          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="20%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
          </linearGradient>
          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
          <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="70%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f97316" />
          </linearGradient>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
          </radialGradient>
          <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
          </filter>
        </defs>

        <!-- Background / Sky -->
        <rect width="800" height="440" fill="url(#skyGrad)" />
        <circle cx="700" cy="80" r="120" fill="url(#sunGlow)" />
        <circle cx="700" cy="80" r="42" fill="#f8fafc" opacity="0.9" filter="blur(1px)" />

        <!-- Distant Mountains -->
        <polygon points="0,320 120,240 280,320" fill="#1e293b" opacity="0.6" />
        <polygon points="220,320 380,210 520,320" fill="#1e293b" opacity="0.4" />
        <polygon points="460,320 600,230 760,320" fill="#1e293b" opacity="0.5" />

        <!-- Floating Stylized Clouds -->
        <g class="cloud-1" opacity="0.25">
          <ellipse cx="0" cy="110" rx="45" ry="18" fill="#cbd5e1" />
          <ellipse cx="25" cy="100" rx="30" ry="22" fill="#cbd5e1" />
          <ellipse cx="-20" cy="108" rx="28" ry="16" fill="#cbd5e1" />
        </g>
        <g class="cloud-2" opacity="0.18">
          <ellipse cx="0" cy="70" rx="60" ry="20" fill="#cbd5e1" />
          <ellipse cx="35" cy="60" rx="40" ry="25" fill="#cbd5e1" />
        </g>

        <!-- Ground & Highway -->
        <rect y="330" width="800" height="110" fill="url(#roadGrad)" />
        <line x1="0" y1="330" x2="800" y2="330" stroke="#10b981" stroke-width="2" opacity="0.4" />
        <!-- Road Moving Dashes -->
        <g class="road-dashes">
          <line x1="-80" y1="380" x2="900" y2="380" stroke="#f8fafc" stroke-width="4" stroke-dasharray="45 35" opacity="0.6" />
        </g>

        <!-- Ground Contact Shadow -->
        <ellipse cx="400" cy="378" rx="190" ry="10" fill="#000000" opacity="0.6" filter="blur(4px)" />

        <!-- ================= Bicycle & Pelican Rig ================= -->
        <g id="bike-pelican-rig">

          <!-- Rear Wheel (Centered at 260, 320) -->
          <g transform="translate(260, 320)">
            <!-- Outer Tire -->
            <circle cx="0" cy="0" r="54" fill="none" stroke="#0f172a" stroke-width="8" />
            <circle cx="0" cy="0" r="50" fill="none" stroke="#64748b" stroke-width="2.5" />
            <!-- Spokes -->
            <g class="spokes">
              <line x1="-48" y1="0" x2="48" y2="0" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="0" y1="-48" x2="0" y2="48" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="-34" y1="-34" x2="34" y2="34" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="-34" y1="34" x2="34" y2="-34" stroke="#94a3b8" stroke-width="1.5" />
            </g>
            <!-- Hub -->
            <circle cx="0" cy="0" r="8" fill="#10b981" />
            <circle cx="0" cy="0" r="4" fill="#f8fafc" />
          </g>

          <!-- Front Wheel (Centered at 520, 320) -->
          <g transform="translate(520, 320)">
            <circle cx="0" cy="0" r="54" fill="none" stroke="#0f172a" stroke-width="8" />
            <circle cx="0" cy="0" r="50" fill="none" stroke="#64748b" stroke-width="2.5" />
            <g class="spokes">
              <line x1="-48" y1="0" x2="48" y2="0" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="0" y1="-48" x2="0" y2="48" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="-34" y1="-34" x2="34" y2="34" stroke="#94a3b8" stroke-width="1.5" />
              <line x1="-34" y1="34" x2="34" y2="-34" stroke="#94a3b8" stroke-width="1.5" />
            </g>
            <circle cx="0" cy="0" r="8" fill="#10b981" />
            <circle cx="0" cy="0" r="4" fill="#f8fafc" />
          </g>

          <!-- Bicycle Frame Geometry -->
          <!-- Rear Dropouts to Crank (Chainstay) -->
          <line x1="260" y1="320" x2="400" y2="320" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Rear Dropouts to Saddle Cluster (Seatstay) -->
          <line x1="260" y1="320" x2="350" y2="225" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round" />
          <!-- Crank to Saddle (Seat Tube) -->
          <line x1="400" y1="320" x2="350" y2="225" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />
          <!-- Crank to Headtube (Down Tube) -->
          <line x1="400" y1="320" x2="480" y2="210" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />
          <!-- Saddle to Headtube (Top Tube) -->
          <line x1="350" y1="225" x2="480" y2="210" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Front Fork (Headtube to Front Axle) -->
          <line x1="480" y1="210" x2="520" y2="320" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Stem & Handlebars -->
          <line x1="480" y1="210" x2="475" y2="180" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
          <!-- Handlebar Grips -->
          <path d="M 465 180 Q 485 170 500 185" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

          <!-- Saddle Post & Seat -->
          <line x1="350" y1="225" x2="340" y2="205" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
          <path d="M 315 205 C 330 200, 360 200, 370 207 C 360 215, 330 215, 315 205 Z" fill="#0f172a" />

          <!-- Crank, Chainring and Pedals -->
          <circle cx="400" cy="320" r="18" fill="#334155" stroke="#64748b" stroke-width="3" />
          <g class="crank-assembly">
            <!-- Crank arm 1 (to pedal 1) -->
            <line x1="400" y1="320" x2="400" y2="348" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
            <rect x="388" y="345" width="24" height="7" rx="3" fill="#0f172a" />
            <!-- Crank arm 2 (opposite pedal) -->
            <line x1="400" y1="320" x2="400" y2="292" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
            <rect x="388" y="288" width="24" height="7" rx="3" fill="#0f172a" />
          </g>

          <!-- ================= Pelican Character Rig ================= -->
          <g class="pelican-rider">
            <!-- Left Wing/Arm (Reaching to Handlebar) -->
            <path d="M 370 190 Q 430 190 480 185" fill="none" stroke="#f1f5f9" stroke-width="16" stroke-linecap="round" />
            <path d="M 470 185 Q 485 185 490 185" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

            <!-- Pelican Body / Feathered Torso -->
            <ellipse cx="360" cy="195" rx="38" ry="46" fill="#f8fafc" filter="url(#dropShadow)" />
            <!-- Wing Covert Layer -->
            <path d="M 335 185 C 340 215, 380 220, 385 190 C 375 170, 345 170, 335 185 Z" fill="#e2e8f0" />

            <!-- Tail Feathers -->
            <path d="M 322 205 Q 300 215 310 225 Q 325 220 330 210 Z" fill="#cbd5e1" />

            <!-- Legs Pedaling (Connected to Crank Area) -->
            <path d="M 365 230 Q 380 270 400 300 L 400 325" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Orange Webbed Foot on Pedal -->
            <ellipse cx="400" cy="325" rx="12" ry="5" fill="#ea580c" />

            <!-- Graceful Curved Neck -->
            <path d="M 375 175 C 390 145, 385 115, 410 110" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round" />

            <!-- Pelican Head -->
            <circle cx="415" cy="110" r="22" fill="#f8fafc" />

            <!-- Pelican Characteristic Beak & Throat Pouch -->
            <!-- Upper Beak -->
            <path d="M 425 100 L 515 125 L 430 120 Z" fill="url(#beakGrad)" />
            <!-- Lower Beak & Famous Throat Pouch -->
            <g class="pelican-lower-beak">
              <!-- Expandable Pouch -->
              <path d="M 425 120 Q 470 165 505 128 L 430 120 Z" fill="#f59e0b" opacity="0.9" />
              <!-- Hook at Tip of Beak -->
              <path d="M 510 124 Q 518 127 514 133" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
            </g>

            <!-- Keen Eye & Cute Blink -->
            <circle cx="422" cy="105" r="5" fill="#0f172a" />
            <circle cx="423.5" cy="103.5" r="1.8" fill="#ffffff" />

            <!-- Pelican Chic Helmet (Safety First!) -->
            <path d="M 395 105 C 395 85, 435 85, 438 105 Z" fill="#10b981" />
            <!-- Helmet Strap -->
            <path d="M 405 105 L 415 126" stroke="#047857" stroke-width="2.5" />
            <ellipse cx="417" cy="90" rx="14" ry="4" fill="#34d399" opacity="0.6" />
          </g>
        </g>
      </svg>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="ctrl-btn active" id="btnTogglePlay">
          <span id="playIcon">⏸</span> 暂停/播放
        </button>
        <button class="ctrl-btn" id="btnTurbo">
          <span>⚡</span> 疾速冲刺
        </button>
        <button class="ctrl-btn" id="btnBell">
          <span>🔔</span> 鸣响车铃
        </button>
      </div>

      <div class="btn-group">
        <button class="ctrl-btn" id="btnNight">
          <span>🌓</span> 切换滤镜
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const stage = document.getElementById('stage');
      const btnTogglePlay = document.getElementById('btnTogglePlay');
      const playIcon = document.getElementById('playIcon');
      const btnTurbo = document.getElementById('btnTurbo');
      const btnBell = document.getElementById('btnBell');
      const btnNight = document.getElementById('btnNight');
      const speedReadout = document.getElementById('speedReadout');

      let isPaused = false;
      let isTurbo = false;
      let isAltFilter = false;

      // Toggle Pause/Play
      btnTogglePlay.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          stage.classList.add('paused');
          playIcon.textContent = '▶';
          btnTogglePlay.classList.remove('active');
          speedReadout.textContent = '速度: 0 km/h (已驻车)';
        } else {
          stage.classList.remove('paused');
          playIcon.textContent = '⏸';
          btnTogglePlay.classList.add('active');
          speedReadout.textContent = isTurbo ? '速度: 48 km/h (冲刺中)' : '速度: 24 km/h';
        }
      });

      // Turbo Sprint Toggle
      btnTurbo.addEventListener('click', () => {
        isTurbo = !isTurbo;
        if (isTurbo) {
          stage.classList.add('turbo');
          btnTurbo.classList.add('active');
          if (!isPaused) speedReadout.textContent = '速度: 48 km/h (冲刺中)';
        } else {
          stage.classList.remove('turbo');
          btnTurbo.classList.remove('active');
          if (!isPaused) speedReadout.textContent = '速度: 24 km/h';
        }
      });

      // Bicycle Bell Synthesizer (Web Audio API, 0 external deps)
      let audioCtx = null;
      btnBell.addEventListener('click', () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!audioCtx) audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const now = audioCtx.currentTime;
          // Dual frequency bell chime
          [1760, 2637].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.15, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.4);
          });
        } catch (e) {}
      });

      // Toggle Night / Neon Palette
      btnNight.addEventListener('click', () => {
        isAltFilter = !isAltFilter;
        if (isAltFilter) {
          stage.style.filter = 'hue-rotate(180deg) contrast(1.1)';
        } else {
          stage.style.filter = 'none';
        }
      });
    })();
  </script>
</body>
</html>
