[project]
name = "tihu"
version = "0.1.0-recovered"
description = "BYOK community model playground with isolated pi agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.40.0", "SQLAlchemy==2.0.50",
  "psycopg[binary]==3.2.13", "pydantic==2.13.4", "cryptography==46.0.4",
  "argon2-cffi==25.1.0", "aiohttp==3.13.3", "python-multipart==0.0.22", "Pillow==11.3.0"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
